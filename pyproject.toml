[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "impara"
version = "0.2.0"
description = "A simple calculator package and command-line tool"
readme = "README.md"
authors = [{ name = "ivanbright", email = "mugishaivanbright250@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
impara = "impara.cli:main"

[project.urls]
Homepage = "https://github.com/ivanbright/impara"

[tool.setuptools.packages.find]
where = ["src"]