[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "impara"
version = "0.5.0"
description = "Discover real, evidence-backed problems worth building"
readme = "README.md"
authors = [{ name = "ivanbright", email = "mugishaivanbright250@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "textual>=0.80; python_version >= '3.9'",
]

[project.optional-dependencies]
tui = ["textual>=0.80; python_version >= '3.9'"]

[project.scripts]
impara = "impara.cli:main"

[project.urls]
Homepage = "https://github.com/ivanbright/impara"

[tool.setuptools.packages.find]
where = ["src"]